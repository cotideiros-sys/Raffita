<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para vos ❤️</title>
<style>
:root{--bg1:#0f1a3a;--bg2:#2a1b4d;--text:#fff;--soft:#c9d3f5;--accent:#ff6f91;--card:#fffaf0;--ink:#2b2b3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0f1a3a;--bg2:#2a1b4d}}
:root[data-theme="dark"]{--bg1:#0f1a3a;--bg2:#2a1b4d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
canvas{position:fixed;inset:0;pointer-events:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px;animation:in .8s}
.screen.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-size:2rem;margin:0;font-weight:normal}
.sub{color:var(--soft);font-style:italic}
#gift{font-size:6rem;background:none;border:0;cursor:pointer;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
#lines{width:100%;font-size:1.3rem;line-height:1.6;min-height:11em}
button.go{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 28px;font:inherit;font-size:1rem;cursor:pointer;opacity:0;transition:opacity 1s}
button.go.show{opacity:1}
.box{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(380px,100%);box-sizing:border-box;padding:22px 18px;border-radius:24px;background:rgba(14,18,48,.78);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 12px 40px #0006}
.ticket{background:var(--card);color:var(--ink);border-radius:16px;width:100%;box-sizing:border-box;padding:20px;text-align:left;box-shadow:0 10px 40px #0008;font-family:'Courier New',monospace}
.route small{display:block;font-size:.65rem;font-weight:normal;color:#8a8aa0;letter-spacing:.1em}#to{text-align:right}
.ticket .t{font-size:.7rem;letter-spacing:.2em;color:#8a8aa0}
.route{display:flex;justify-content:space-between;align-items:center;font-size:1.6rem;font-weight:bold;margin:8px 0 14px}
.route span.p{font-size:1.2rem}
.cut{border-top:2px dashed #c8c8d8;margin:12px -20px;position:relative}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.85rem}
.grid b{display:block;font-size:1rem}
#count{font-size:min(1.1rem,calc((100vw - 86px)/19));white-space:nowrap;text-align:center;color:var(--text)}
</style>
</head>
<body>
<canvas id="snow"></canvas>

<div class="screen on" id="s1">
 <div class="box">
  <div class="sub">para <span id="n1"></span></div>
  <button id="gift" aria-label="Open gift">🎁</button>
  <div class="sub">tocá para abrir</div>
 </div>
</div>

<div class="screen" id="s2">
 <div class="box">
  <div id="lines"></div>
  <button class="go" id="next">seguí →</button>
 </div>
</div>

<div class="screen" id="s3">
 <div class="box">
  <h1>Sorpresa!</h1>
  <div class="ticket">
    <div class="t">TARJETA DE EMBARQUE</div>
    <div class="route"><span id="from"></span><span class="p">✈</span><span id="to"></span></div>
    <div class="cut"></div>
    <div class="grid">
      <div>PASAJERO<b id="pn"></b></div>
      <div>ASIENTO<b>22D</b></div>
      <div style="grid-column:1/-1">LLEGADA<b>9:05 AM el 11 de diciembre</b></div>
    </div>
  </div>
  <div id="count"></div>
  <div class="sub" id="foot"></div>
 </div>
</div>

<script>
// ✏️ EDIT THESE
var C={
  name:"Cotito", nickname:"Raffita",
  from:'MIA<small>MIAMI</small>', to:'EZE<small>BUENOS AIRES</small>',
  // Hora de Buenos Aires (UTC-3). 11 de diciembre, 9:05 AM:
  date:"2026-12-11T09:05:00-03:00",
  lines:[
    "Hola amor,",
    "acá tengo una sorpresa para vos...",
    "fijate si te interesa 😁"
  ],
  foot:"Nos vemos en tu graduación preciosa. Te amo ❤️"
};

function $(i){return document.getElementById(i)}
$("n1").textContent=C.nickname;$("from").innerHTML=C.from;$("to").innerHTML=C.to;
$("pn").textContent=C.name;$("foot").textContent=C.foot;
function show(id){document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("on")});$(id).classList.add("on")}

$("gift").onclick=function(){show("s2");play()};
$("next").onclick=function(){show("s3");tick();setInterval(tick,1000)};

function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function play(){
  var box=$("lines");box.innerHTML="";
  for(var i=0;i<C.lines.length;i++){
    var p=document.createElement("p");box.appendChild(p);
    for(var c of C.lines[i]){p.textContent+=c;await sleep(45)}
    await sleep(700);
  }
  $("next").classList.add("show");
}
function tick(){
  var d=new Date(C.date)-new Date();
  if(d<=0){$("count").textContent="Ya llegué ❤️";return}
  var s=Math.floor(d/1000);
  $("count").textContent="Reencuentro en "+Math.floor(s/86400)+"d "+Math.floor(s%86400/3600)+"h "+Math.floor(s%3600/60)+"m "+s%60+"s";
}

var cv=$("snow"),x=cv.getContext("2d"),F=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener("resize",rs);
for(var i=0;i<14;i++)F.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*30+45,vx:(Math.random()-.5)*.8,vy:Math.random()*.8+.4,a:Math.random()*6.28,w:(Math.random()-.5)*.03});
(function f(){
x.clearRect(0,0,cv.width,cv.height);
var b=document.querySelector(".screen.on .box"),r=b&&b.getBoundingClientRect();
F.forEach(function(p){
 var h=p.s/2;
 p.vy=Math.min(p.vy+.02,1.8);p.vx=Math.max(-2,Math.min(2,p.vx*.997));
 p.x+=p.vx;p.y+=p.vy;p.a+=p.w;
 if(p.x<h){p.x=h;p.vx=Math.abs(p.vx)}
 if(p.x>cv.width-h){p.x=cv.width-h;p.vx=-Math.abs(p.vx)}
 if(r&&p.x+h>r.left&&p.x-h<r.right&&p.y+h>r.top&&p.y-h<r.bottom){
  var ol=p.x+h-r.left,or=r.right-(p.x-h),ot=p.y+h-r.top,ob=r.bottom-(p.y-h),m=Math.min(ol,or,ot,ob);
  if(m==ot){p.y-=ot;p.vy=-Math.abs(p.vy)*.7;p.vx+=(p.x<(r.left+r.right)/2?-1:1)*.6}
  else if(m==ob){p.y+=ob;p.vy=Math.abs(p.vy)*.7}

  else{p.x+=or;p.vx=Math.abs(p.vx)+.3}
 }

 if(IMG.complete){x.save();x.translate(p.x,p.y);x.rotate(p.a);x.shadowColor="rgba(0,0,0,.35)";x.shadowBlur=8;x.drawImage(IMG,-h,-h,p.s,p.s);x.restore()}
